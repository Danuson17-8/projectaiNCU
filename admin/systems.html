<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบแจ้งปัญหาการใช้งานระบบมหาวิทยาลัย — Admin — จัดการระบบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="page">

  <div class="admin-body">

    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="logo-mark">NCU</div>
        <div class="sidebar-brand-text">
          <span class="wordmark">ระบบแจ้งปัญหา<span class="wordmark-long">การใช้งานระบบมหาวิทยาลัย</span></span>
          <span class="pill pill-dark">Admin</span>
        </div>
      </div>

      <nav class="admin-nav">
        <a class="admin-nav-item" href="dashboard.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></a>
        <a class="admin-nav-item active" aria-current="page" href="systems.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg><span>Systems</span></a>
        <a class="admin-nav-item" href="tickets.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg><span>Tickets</span></a>
      </nav>

      <a class="sidebar-link sidebar-switch" href="../index.html">← มุมมอง user</a>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="sidebar-user-avatar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span class="sidebar-user-email" id="sidebar-user-email"></span>
        </div>
        <button class="btn btn-secondary btn-icon btn-logout" id="logout-btn" aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></button>
      </div>
    </aside>

    <div class="admin-main">
      <div class="row-between">
        <div>
          <h1 style="margin: 0; font-size: 19px; font-weight: 700;">ระบบทั้งหมด</h1>
          <p style="margin: 4px 0 0; font-size: 12.5px;" class="text-faint">รายการระบบที่แสดงให้ user เลือกตอนแจ้งปัญหา</p>
        </div>
        <button class="btn btn-primary" id="add-system-btn">+ เพิ่มระบบใหม่</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>ระบบ</th>
              <th>Slug</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="systems-tbody">
            <tr><td colspan="4" class="text-faint">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel" id="system-panel" hidden>
      <div>
        <h2 style="margin: 0; font-size: 15px; font-weight: 700;" id="panel-title">เพิ่มระบบใหม่</h2>
        <p style="margin: 4px 0 0; font-size: 12px; line-height: 1.5;" class="text-faint">ระบบนี้จะไปแสดงในหน้าที่ user เลือกก่อนแจ้งปัญหาทันที (ถ้าเปิดใช้งาน)</p>
      </div>

      <form id="system-form" class="stack" style="gap: 16px;">
        <input type="hidden" id="sys-id">

        <div class="field">
          <label for="sys-name">ชื่อระบบ</label>
          <input type="text" id="sys-name" placeholder="เช่น ระบบแจ้งเตือน SMS" required>
        </div>

        <div class="field">
          <label for="sys-slug">รหัสระบบ (slug)</label>
          <input type="text" id="sys-slug" class="mono" placeholder="sms-notify" required pattern="[a-z0-9-]+">
        </div>

        <div class="field">
          <label for="sys-desc">คำอธิบายสั้น ๆ</label>
          <textarea id="sys-desc" rows="2" placeholder="ใช้แสดงใต้ชื่อระบบในหน้าเลือกระบบของ user"></textarea>
        </div>

        <fieldset style="border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">
          <legend style="font-size: 11.5px; font-weight: 600; padding: 0; margin-bottom: 2px;" class="text-muted">สีไอคอน</legend>
          <div class="row" style="gap: 10px;">
            <input type="radio" name="sys-color" class="swatch" value="#0F6C61" checked aria-label="เขียวอมฟ้า" style="background: #0F6C61; color: #0F6C61;">
            <input type="radio" name="sys-color" class="swatch" value="#2563EB" aria-label="น้ำเงิน" style="background: #2563EB; color: #2563EB;">
            <input type="radio" name="sys-color" class="swatch" value="#7C3AED" aria-label="ม่วง" style="background: #7C3AED; color: #7C3AED;">
            <input type="radio" name="sys-color" class="swatch" value="#D97757" aria-label="ส้ม" style="background: #D97757; color: #D97757;">
            <input type="radio" name="sys-color" class="swatch" value="#B3311C" aria-label="แดง" style="background: #B3311C; color: #B3311C;">
          </div>
        </fieldset>

        <label class="row" style="gap: 8px;">
          <input type="checkbox" id="sys-active" class="toggle" checked aria-label="เปิดใช้งานระบบนี้">
          <span style="font-size: 13px;">เปิดใช้งาน (แสดงให้ user เลือก)</span>
        </label>

        <p class="field-error" id="system-form-error"></p>

        <div class="row" style="gap: 10px; margin-top: 4px;">
          <button type="button" class="btn btn-secondary" id="cancel-panel-btn" style="flex-grow: 1;">ยกเลิก</button>
          <button type="submit" class="btn btn-primary" style="flex-grow: 1;">บันทึกระบบ</button>
        </div>
      </form>
    </div>

  </div>
</div>

<script type="module" src="../assets/js/admin-systems.js"></script>
</body>
</html>
