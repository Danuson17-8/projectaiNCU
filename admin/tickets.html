<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Issue Desk — Admin — Tickets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="page">

  <div class="topbar topbar-admin">
    <div class="topbar-left">
      <div class="logo-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
      </div>
      <span class="wordmark">Issue Desk</span>
      <span class="pill pill-dark">Admin</span>
    </div>
    <div class="topbar-right">
      <a class="topbar-link" href="../index.html">← มุมมอง user</a>
      <button class="btn btn-secondary" id="logout-btn" style="padding: 6px 12px; font-size: 12px;">ออกจากระบบ</button>
    </div>
  </div>

  <div class="admin-body">

    <div class="admin-nav">
      <a class="admin-nav-item" href="systems.html">Systems</a>
      <a class="admin-nav-item active" href="tickets.html">Tickets</a>
    </div>

    <div class="admin-main">
      <div class="row-between">
        <div>
          <h1 style="margin: 0; font-size: 19px; font-weight: 700;">รายการแจ้งปัญหา</h1>
          <p style="margin: 4px 0 0; font-size: 12.5px;" class="text-faint">อัปเดตสถานะเมื่อทีมงานตรวจสอบหรือแก้ไขเสร็จแล้ว</p>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>ระบบ</th>
              <th>ข้อความที่แจ้ง</th>
              <th>แจ้งเมื่อ</th>
              <th>สถานะ</th>
              <th>Ticket ID</th>
            </tr>
          </thead>
          <tbody id="tickets-tbody">
            <tr><td colspan="5" class="text-faint">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script type="module" src="../assets/js/admin-tickets.js"></script>
</body>
</html>
