<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบแจ้งปัญหาการใช้งานระบบมหาวิทยาลัย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.9.28/dist/dotlottie-wc.js"></script>
</head>
<body class="bg-waves">
<div class="page">

  <dotlottie-wc
    class="bg-lottie"
    src="assets/images/Register.lottie"
    autoplay
    loop
    aria-hidden="true"
  ></dotlottie-wc>

  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-mark">NCU</div>
      <span class="wordmark">ระบบแจ้งปัญหา<span class="wordmark-long">การใช้งานระบบมหาวิทยาลัย</span></span>
    </div>
    <div class="topbar-right">
      <span class="text-faint user-email" id="user-email"></span>
      <a class="btn btn-secondary btn-admin-link" href="admin/login.html">แอดมิน<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
      <button class="btn btn-secondary btn-icon btn-logout" id="logout-btn" aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></button>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 56px 24px;">
    <div style="width: 100%; max-width: 780px;" class="stack">

      <div class="stack" style="gap: 16px; align-items: center;">
        <div class="tab-switch" role="tablist">
          <button type="button" class="tab-btn" id="tab-report" role="tab" aria-selected="true" data-active="true">แจ้งปัญหา</button>
          <button type="button" class="tab-btn" id="tab-history" role="tab" aria-selected="false">ประวัติการแจ้ง</button>
        </div>
        <p style="margin: 0; font-size: 14px; text-align: center;" class="text-muted" id="panel-subtitle">เลือกระบบที่คุณพบปัญหา เพื่อเริ่มแจ้งปัญหา</p>
      </div>

      <div id="panel-report">
        <div id="systems-grid" class="systems-grid">
          <p class="text-faint" id="systems-loading">กำลังโหลดรายการระบบ...</p>
        </div>
      </div>

      <div id="panel-history" class="stack" style="gap: 10px;" hidden>
        <p class="text-faint" id="tickets-loading">กำลังโหลด...</p>
      </div>

    </div>
  </div>

</div>

<script type="module" src="assets/js/index.js"></script>
</body>
</html>
