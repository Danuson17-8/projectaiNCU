<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Issue Desk — แจ้งปัญหา</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
      </div>
      <span class="wordmark" id="topbar-title">Issue Desk</span>
    </div>
    <div class="topbar-right">
      <a class="topbar-link" href="index.html">← เปลี่ยนระบบ</a>
    </div>
  </div>

  <div id="status-panel" class="card" hidden style="margin: 16px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
    <div class="stack" style="gap: 4px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;" class="text-faintest">หมายเลข Ticket</span>
      <span class="mono" id="status-ticket-id" style="font-size: 13px;"></span>
    </div>
    <span class="badge" id="status-badge"></span>
  </div>

  <div id="chat-log" class="chat-log"></div>

  <div id="chat-input-row" class="chat-input-row">
    <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ...">
    <button class="chat-send-btn" id="chat-send-btn" aria-label="ส่งข้อความ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>

</div>

<script type="module" src="assets/js/report.js"></script>
</body>
</html>
